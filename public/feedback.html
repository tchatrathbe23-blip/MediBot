<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Feedback - MediBot</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function() {
      const theme = localStorage.getItem("theme");
      if (theme === "dark" || !theme) document.documentElement.classList.add("dark-mode");
    })();
  </script>
</head>
<body id="mainBody">

  <!-- Ambient 3D background canvas -->
  <canvas id="bg-canvas"></canvas>

  <aside class="app-sidebar" id="sidebar">
    <div class="brand">
      <i class="ph ph-heartbeat"></i> <span>MediBot</span>
    </div>
    <nav class="nav-menu">
      <a href="index.html" class="nav-item"><i class="ph ph-grid-four"></i> <span>Dashboard</span></a>
      <a href="appointments.html" class="nav-item"><i class="ph ph-calendar"></i> <span>Appointments</span></a>
      <a href="medications.html" class="nav-item"><i class="ph ph-pill"></i> <span>Medications</span></a>
      <a href="my-reports.html" class="nav-item"><i class="ph ph-clipboard-text"></i> <span>Clinical History</span></a>
      <a href="profile.html" class="nav-item"><i class="ph ph-user"></i> <span>My Profile</span></a>
      <div style="margin-top:2rem; padding: 0 0.5rem;" id="authLinks"></div>
    </nav>
  </aside>

  <main class="app-main">
    <div class="top-bar">
      <div style="display:flex; align-items:center; gap:1rem;">
        <button class="icon-btn" id="toggleSidebar"><i class="ph ph-list"></i></button>
        <div class="welcome-msg">
          <h1>Clinical Experience & Feedback</h1>
          <p>Help us continuously refine MediBot AI diagnostic intelligence.</p>
        </div>
      </div>
      <button class="icon-btn" id="toggleTheme"><i class="ph ph-sun"></i></button>
    </div>

    <div class="card" style="max-width: 650px;">
       <h2 style="font-size:1.25rem; font-weight:700; color:var(--primary); margin-bottom:1rem;">
         <i class="ph ph-chat-circle-text"></i> Patient Feedback Form
       </h2>
       <textarea id="feedbackText" placeholder="How was your clinical analysis experience? Share suggestions, accuracy feedback, or feature requests..."
         style="width:100%; height:150px; padding:1rem; border-radius:0.85rem; border:1px solid var(--glass-border); background:rgba(17,24,39,0.7); color:var(--text-main); font-family:inherit; outline:none;"></textarea>
       <button class="btn-primary" id="submitFeedback" style="margin-top:1.25rem;">
         <i class="ph ph-paper-plane-tilt"></i> Submit Feedback
       </button>
       <div id="feedbackNotice" style="margin-top:1.25rem; display:none; color:var(--success); font-weight:600; background:rgba(16,185,129,0.1); padding:0.75rem; border-radius:0.75rem; border:1px solid rgba(16,185,129,0.3);">
          <i class="ph ph-check-circle"></i> Thank you! Your feedback has been logged into our clinical improvement pipeline.
       </div>
    </div>
  </main>

  <script src="js/medi-assistant.js"></script>
  <script>
    // 3D Background
    (function() {
      const canvas = document.getElementById("bg-canvas");
      if (!canvas || !window.THREE) return;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 30;
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const pGeo = new THREE.BufferGeometry();
      const pos = new Float32Array(150 * 3);
      for (let i = 0; i < 150 * 3; i++) pos[i] = (Math.random() - 0.5) * 60;
      pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const pMat = new THREE.PointsMaterial({ color: 0x06b6d4, size: 0.25, transparent: true, opacity: 0.4 });
      const pMesh = new THREE.Points(pGeo, pMat);
      scene.add(pMesh);

      function anim() {
        requestAnimationFrame(anim);
        pMesh.rotation.y += 0.0006;
        renderer.render(scene, camera);
      }
      anim();
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();

    window.onload = () => {
      const token = localStorage.getItem("token");
      if (!token) window.location.href = "login.html";

      const sidebar = document.getElementById("sidebar");
      const toggleSidebar = document.getElementById("toggleSidebar");
      const toggleTheme = document.getElementById("toggleTheme");

      if (localStorage.getItem("theme") === "dark" || !localStorage.getItem("theme")) {
        document.documentElement.classList.add("dark-mode");
        toggleTheme.innerHTML = '<i class="ph ph-sun"></i>';
      } else {
        document.documentElement.classList.remove("dark-mode");
        toggleTheme.innerHTML = '<i class="ph ph-moon"></i>';
      }

      if (localStorage.getItem("sidebar") === "collapsed") sidebar.classList.add("collapsed");

      toggleTheme.onclick = () => {
        const isDark = document.documentElement.classList.toggle("dark-mode");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        toggleTheme.innerHTML = isDark ? '<i class="ph ph-sun"></i>' : '<i class="ph ph-moon"></i>';
      };

      toggleSidebar.onclick = () => {
        sidebar.classList.toggle("collapsed");
        localStorage.setItem("sidebar", sidebar.classList.contains("collapsed") ? "collapsed" : "expanded");
      };

      const authLinks = document.getElementById("authLinks");
      authLinks.innerHTML = `<a href="logout.html" class="nav-item" id="logoutBtn" style="color:var(--danger)"><i class="ph ph-sign-out"></i> <span>Logout</span></a>`;

      document.getElementById("submitFeedback").onclick = async () => {
        const fb = document.getElementById("feedbackText").value.trim();
        if (!fb) return;

        try {
          const res = await fetch("/submit-feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": token },
            body: JSON.stringify({ feedback: fb })
          });
          const data = await res.json();
          if (data.success) {
            document.getElementById("feedbackText").value = "";
            const notice = document.getElementById("feedbackNotice");
            notice.style.display = "block";
            setTimeout(() => notice.style.display = "none", 4000);
          }
        } catch (e) {}
      };
    };
  </script>
</body>
</html>
