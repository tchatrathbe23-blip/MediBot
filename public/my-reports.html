<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Saved Reports - MediBot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    /* --- CSS Reset & Variables --- */
    :root {
      --bg-sidebar: #0f172a;
      --bg-main: #020617;
      --primary: #a855f7;
      --primary-hover: #9333ea;
      --secondary: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --danger: #ef4444;
      --card-bg: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* --- SIDEBAR --- */
    .app-sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 0;
      height: 100%;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: white;
    }
    .brand-icon {
      background: white;
      color: var(--bg-main);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      margin: 0 1rem 1.5rem 1rem;
      background-color: rgba(255,255,255,0.03);
      border-radius: 0.75rem;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .user-profile img {
      width: 40px; height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-info h4 { font-size: 0.95rem; font-weight: 600; }
    .user-info span { font-size: 0.75rem; color: var(--text-muted); }

    .nav-menu {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0 1rem;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .nav-item i { font-size: 1.2rem; }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .nav-item.active {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }

    .nav-footer {
      padding: 1rem 1.5rem 0 1.5rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* --- MAIN CONTENT --- */
    .app-main {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 3rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .page-header {
      margin-bottom: 2rem;
    }
    .page-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: 1rem;
      flex-wrap: wrap;
    }

    input, select {
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border-color);
      background: rgba(255,255,255,0.05);
      color: white;
      outline: none;
      font-family: inherit;
    }
    input:focus, select:focus { border-color: var(--primary); }

    /* Reports Grid */
    #reportsContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
    }

    .report-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      border-radius: 1rem;
      transition: all 0.2s;
      cursor: pointer;
    }
    .report-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .report-card .date {
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: block;
    }

    .report-card .content {
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-muted);
      overflow: hidden;
      display: -webkit-box;
      line-clamp: 5;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
    }
  </style>
</head>
<body>

  <!-- LEFT SIDEBAR -->
  <aside class="app-sidebar">
    <div class="brand">
      <div class="brand-icon"><i class="ph ph-robot"></i></div>
      MediBot
    </div>

    <div class="user-profile">
      <img src="https://ui-avatars.com/api/?name=User&background=a855f7&color=fff" alt="User Profile">
      <div class="user-info">
        <h4>Demo User</h4>
        <span>History Viewer</span>
      </div>
    </div>

    <nav class="nav-menu">
      <a href="index.html" class="nav-item"><i class="ph ph-file-text"></i> Summary Tool</a>
      <a href="appointments.html" class="nav-item"><i class="ph ph-calendar"></i> Appointments</a>
      <a href="medications.html" class="nav-item"><i class="ph ph-pill"></i> Medications</a>
      <a href="my-reports.html" class="nav-item active"><i class="ph ph-clock-counter-clockwise"></i> History / Reports</a>
      <a href="profile.html" class="nav-item"><i class="ph ph-user"></i> My Profile</a>
      <a href="feedback.html" class="nav-item"><i class="ph ph-chat-centered-text"></i> Feedback</a>
    </nav>

    <div class="nav-footer">
      <a href="#" class="nav-item" id="themeToggle"><i class="ph ph-sun"></i> Light Mode</a>
      <a href="#" class="nav-item" style="color: var(--danger);" id="logoutSidebar"><i class="ph ph-sign-out"></i> Sign Out</a>
    </div>
  </aside>

  <main class="app-main">
    <div class="page-header">
      <h1>My Saved Reports</h1>
      <p>Your previous health analysis overview</p>
    </div>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search reports..." />
      <select id="dateFilter">
        <option value="all">All Time</option>
        <option value="7">Last 7 Days</option>
        <option value="30">Last 30 Days</option>
      </select>
      <select id="sortOrder">
        <option value="new">Newest First</option>
        <option value="old">Oldest First</option>
      </select>
    </div>

    <div id="reportsContainer">Loading reports...</div>
  </main>

<script>
  const API_BASE = "";;
  let allReports = []; // store fetched reports

  window.onload = function() {
      // Theme logic
      const themeToggle = document.getElementById("themeToggle");
      if (localStorage.getItem("theme") === "light") {
        document.body.classList.add("light-mode");
        themeToggle.innerHTML = '<i class="ph ph-moon"></i> Dark Mode';
      }
      themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("light-mode");
        const isLight = document.body.classList.contains("light-mode");
        localStorage.setItem("theme", isLight ? "light" : "dark");
        themeToggle.innerHTML = isLight ? '<i class="ph ph-moon"></i> Dark Mode' : '<i class="ph ph-sun"></i> Light Mode';
      });

      // Logout logic
      const logoutSidebar = document.getElementById("logoutSidebar");
      if (logoutSidebar) {
        logoutSidebar.addEventListener("click", (e) => {
          e.preventDefault();
          localStorage.removeItem("token");
          localStorage.removeItem("name");
          window.location.href = "landing.html";
        });
      }

      // User profile update
      const userNameDisplay = document.querySelector(".user-info h4");
      const storedName = localStorage.getItem("name");
      if (userNameDisplay && storedName) {
        userNameDisplay.textContent = storedName;
        const profileImg = document.querySelector(".user-profile img");
        if (profileImg) profileImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(storedName)}&background=a855f7&color=fff`;
      }
      
      fetchReports();
  };

  async function fetchReports() {
    const token = localStorage.getItem("token");

    if (!token) {
      document.getElementById("reportsContainer").textContent =
        "You are not logged in.";
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/my-reports`, {
        method: "GET",
        headers: { Authorization: token },
      });

      const data = await res.json();
      const container = document.getElementById("reportsContainer");

      if (!data.success || !data.reports.length) {
        container.textContent = "No saved reports found.";
        return;
      }

      allReports = data.reports;
      renderReports();

    } catch (err) {
      console.error(err);
      document.getElementById("reportsContainer").textContent =
        "Error fetching reports.";
    }
  }

  function renderReports() {
    const container = document.getElementById("reportsContainer");
    container.innerHTML = "";

    let filtered = [...allReports];

    // 🔍 Search filter
    const query = document.getElementById("searchInput").value.toLowerCase();
    if (query) {
      filtered = filtered.filter((r) =>
        r.content.toLowerCase().includes(query)
      );
    }

    // 📅 Date filter
    const dateFilter = document.getElementById("dateFilter").value;
    if (dateFilter !== "all") {
      const days = parseInt(dateFilter);
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - days);
      filtered = filtered.filter((r) => new Date(r.createdAt) >= cutoff);
    }

    // ↕️ Sort order
    const sortOrder = document.getElementById("sortOrder").value;
    filtered.sort((a, b) =>
      sortOrder === "new"
        ? new Date(b.createdAt) - new Date(a.createdAt)
        : new Date(a.createdAt) - new Date(b.createdAt)
    );

    // No results after filters
    if (filtered.length === 0) {
      container.textContent = "No reports match your filters.";
      return;
    }

    // Render cards
    filtered.forEach((r) => {
      const card = document.createElement("div");
      card.className = "report-card";

      const date = new Date(r.createdAt).toLocaleString();

      card.innerHTML = `
        <div class="date">Saved on: ${date}</div>
        <div class="content">${r.content.replace(/\n/g, "<br>")}</div>
      `;

      container.appendChild(card);
    });
  }

  // Live filters
  document.getElementById("searchInput").addEventListener("input", renderReports);
  document.getElementById("dateFilter").addEventListener("change", renderReports);
  document.getElementById("sortOrder").addEventListener("change", renderReports);

  fetchReports();
</script>

  <script>
    document.getElementById('logoutSidebar').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
