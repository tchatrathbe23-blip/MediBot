<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clinical History - MediBot</title>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <aside class="app-sidebar">
    <div class="brand">
      <i class="ph ph-heartbeat"></i> MediBot
    </div>
    <nav class="nav-menu">
      <a href="index.html" class="nav-item"><i class="ph ph-grid-four"></i> Dashboard</a>
      <a href="appointments.html" class="nav-item"><i class="ph ph-calendar"></i> Appointments</a>
      <a href="medications.html" class="nav-item"><i class="ph ph-pill"></i> Medications</a>
      <a href="my-reports.html" class="nav-item active"><i class="ph ph-clipboard-text"></i> Clinical History</a>
      <a href="profile.html" class="nav-item"><i class="ph ph-user"></i> My Profile</a>
      <a href="feedback.html" class="nav-item"><i class="ph ph-chat-centered-text"></i> Feedback</a>
      <div style="margin-top:2rem; padding: 0 1rem;" id="authLinks"></div>
    </nav>
  </aside>

  <main class="app-main">
    <div class="top-bar">
      <div class="welcome-msg">
        <h1>Clinical History</h1>
        <p>Access and manage your previously analyzed medical records.</p>
      </div>
    </div>

    <div class="card">
       <div id="reportsList" style="display:flex; flex-direction:column; gap:1rem;">
          <div style="padding:1rem; border:1px solid var(--border-color); border-radius:1rem; display:flex; justify-content:space-between; align-items:center;">
             <div style="display:flex; align-items:center; gap:1rem;">
                <div style="width:40px; height:40px; border-radius:10px; background:#eff6ff; display:flex; align-items:center; justify-content:center; color:var(--primary);">
                   <i class="ph ph-file-pdf"></i>
                </div>
                <div>
                   <h4 style="margin-bottom:0.25rem;">Blood Report Analysis</h4>
                   <p style="font-size:0.8rem; color:var(--text-muted);">March 15, 2025</p>
                </div>
             </div>
             <button class="btn-primary" style="padding:0.4rem 1rem; font-size:0.8rem;">View Insights</button>
          </div>
       </div>
    </div>
  </main>

  <script src="js/medi-assistant.js"></script>
  <script>
     window.onload = async () => {
        const token = localStorage.getItem("token");
        if (!token) window.location.href = 'login.html';
        const authLinks = document.getElementById("authLinks");
        authLinks.innerHTML = `<a href="#" class="nav-item" id="logoutBtn" style="color:var(--danger)"><i class="ph ph-sign-out"></i> Logout</a>`;
        document.getElementById("logoutBtn").onclick = () => {
           localStorage.clear();
           window.location.href = "login.html";
        };

        // Fetch reports
        const res = await fetch("/my-reports", { headers: { "Authorization": token } });
        const data = await res.json();
        if (data.success && data.reports.length > 0) {
           const list = document.getElementById("reportsList");
           list.innerHTML = "";
           data.reports.forEach(r => {
              const div = document.createElement("div");
              div.style.padding = "1rem";
              div.style.border = "1px solid var(--border-color)";
              div.style.borderRadius = "1rem";
              div.style.display = "flex";
              div.style.justifyContent = "space-between";
              div.style.alignItems = "center";
              div.innerHTML = `
                 <div style="display:flex; align-items:center; gap:1rem;">
                    <div style="width:40px; height:40px; border-radius:10px; background:#eff6ff; display:flex; align-items:center; justify-content:center; color:var(--primary);">
                       <i class="ph ph-file-text"></i>
                    </div>
                    <div>
                       <h4 style="margin-bottom:0.25rem;">Clinical Analysis</h4>
                       <p style="font-size:0.8rem; color:var(--text-muted);">${new Date(r.createdAt).toLocaleDateString()}</p>
                    </div>
                 </div>
                 <button class="btn-primary" style="padding:0.4rem 1rem; font-size:0.8rem;">View</button>
              `;
              div.querySelector('button').onclick = () => alert(r.content);
              list.appendChild(div);
           });
        }
     }
  </script>
</body>
</html>
