<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clinical History - MediBot</title>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    (function() {
      const theme = localStorage.getItem("theme");
      if (theme === "dark") document.documentElement.classList.add("dark-mode");
    })();
  </script>
  <style>
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: 20px; }
    .modal-content { background: var(--card-bg); padding: 2.5rem; border-radius: 1.5rem; width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color); position: relative; }
    .modal-header { position: sticky; top: -2.5rem; background: var(--card-bg); padding: 1rem 0; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
  </style>
</head>
<body id="mainBody">

  <aside class="app-sidebar" id="sidebar">
    <div class="brand">
      <i class="ph ph-heartbeat"></i> <span>MediBot</span>
    </div>
    <nav class="nav-menu">
      <a href="index.html" class="nav-item"><i class="ph ph-grid-four"></i> <span>Dashboard</span></a>
      <a href="appointments.html" class="nav-item"><i class="ph ph-calendar"></i> <span>Appointments</span></a>
      <a href="medications.html" class="nav-item"><i class="ph ph-pill"></i> <span>Medications</span></a>
      <a href="my-reports.html" class="nav-item active"><i class="ph ph-clipboard-text"></i> <span>Clinical History</span></a>
      <a href="profile.html" class="nav-item"><i class="ph ph-user"></i> <span>My Profile</span></a>
      <div style="margin-top:2rem; padding: 0 1rem;" id="authLinks"></div>
    </nav>
  </aside>

  <main class="app-main">
    <div class="top-bar">
      <div style="display:flex; align-items:center; gap:1rem;">
        <button class="icon-btn" id="toggleSidebar"><i class="ph ph-list"></i></button>
        <div class="welcome-msg">
          <h1>Clinical History</h1>
          <p>Access and manage your previously analyzed medical records.</p>
        </div>
      </div>
      <button class="icon-btn" id="toggleTheme"><i class="ph ph-moon"></i></button>
    </div>

    <div class="card">
       <div id="reportsList" style="display:flex; flex-direction:column; gap:1rem;">
          <p style="color:var(--text-muted); text-align:center; padding:2rem;">Syncing your history...</p>
       </div>
    </div>
  </main>

  <!-- Report Detail Modal -->
  <div id="reportModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle" style="font-size:1.5rem;">Clinical Insight</h2>
        <button class="icon-btn" id="closeModalBtn"><i class="ph ph-x"></i></button>
      </div>
      <div id="modalBody" style="line-height:1.6; font-size:1.05rem;">
        <!-- AI Insight Injected Here -->
      </div>
    </div>
  </div>

  <script src="js/medi-assistant.js"></script>
  <script>
    const token = localStorage.getItem("token");

    async function fetchReports() {
      const list = document.getElementById("reportsList");
      try {
        const res = await fetch("/my-reports", { headers: { "Authorization": token } });
        const data = await res.json();
        list.innerHTML = "";
        
        if (data.success && data.reports.length > 0) {
          data.reports.forEach(r => {
            const div = document.createElement("div");
            div.className = "card";
            div.style.padding = "1.25rem";
            div.style.marginBottom = "0.5rem";
            div.style.display = "flex";
            div.style.justifyContent = "space-between";
            div.style.alignItems = "center";
            div.innerHTML = `
              <div style="display:flex; align-items:center; gap:1.25rem;">
                <div style="background:rgba(59,130,246,0.1); color:var(--primary); width:48px; height:48px; border-radius:0.75rem; display:flex; align-items:center; justify-content:center;">
                   <i class="ph ph-file-text" style="font-size:1.5rem;"></i>
                </div>
                <div>
                  <h4 style="margin-bottom:0.25rem;">Medical Analysis</h4>
                  <p style="font-size:0.8rem; color:var(--text-muted);">Stored on ${new Date(r.createdAt).toLocaleDateString()}</p>
                </div>
              </div>
              <button class="btn-primary" style="padding:0.5rem 1.25rem; font-size:0.85rem;">Review Report</button>
            `;
            div.querySelector("button").onclick = () => showReport(r);
            list.appendChild(div);
          });
        } else {
          list.innerHTML = `<p style="color:var(--text-muted); text-align:center; padding:3rem;">No clinical records found in your vault.</p>`;
        }
      } catch (err) { }
    }

    function showReport(report) {
      const modal = document.getElementById("reportModal");
      const body = document.getElementById("modalBody");
      const title = document.getElementById("modalTitle");
      
      title.innerText = "Insight from " + new Date(report.createdAt).toLocaleDateString();
      body.innerHTML = report.content.replace(/\n/g, '<br>');
      modal.style.display = "flex";
    }

    window.onload = () => {
      if (!token) window.location.href = "login.html";

      const sidebar = document.getElementById("sidebar");
      const toggleSidebar = document.getElementById("toggleSidebar");
      const toggleTheme = document.getElementById("toggleTheme");

      if (document.documentElement.classList.contains("dark-mode")) {
        toggleTheme.innerHTML = '<i class="ph ph-sun"></i>';
      }

      if (localStorage.getItem("sidebar") === "collapsed") sidebar.classList.add("collapsed");

      toggleTheme.onclick = () => {
        const isDark = document.documentElement.classList.toggle("dark-mode");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        toggleTheme.innerHTML = isDark ? '<i class="ph ph-sun"></i>' : '<i class="ph ph-moon"></i>';
      };

      toggleSidebar.onclick = () => {
        sidebar.classList.toggle("collapsed");
        localStorage.setItem("sidebar", sidebar.classList.contains("collapsed") ? "collapsed" : "expanded");
      };

      const authLinks = document.getElementById("authLinks");
      authLinks.innerHTML = `<a href="#" class="nav-item" id="logoutBtn" style="color:var(--danger)"><i class="ph ph-sign-out"></i> <span>Logout</span></a>`;
      document.getElementById("logoutBtn").onclick = () => { localStorage.clear(); window.location.href = "login.html"; };

      document.getElementById("closeModalBtn").onclick = () => document.getElementById("reportModal").style.display = "none";
      window.onclick = (e) => { 
        const modal = document.getElementById("reportModal");
        if(e.target == modal) modal.style.display = "none";
      }

      fetchReports();
    };
  </script>
</body>
</html>
