<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clinical History - MediBot</title>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body id="mainBody">

  <aside class="app-sidebar" id="sidebar">
    <div class="brand">
      <i class="ph ph-heartbeat"></i> <span>MediBot</span>
    </div>
    <nav class="nav-menu">
      <a href="index.html" class="nav-item"><i class="ph ph-grid-four"></i> <span>Dashboard</span></a>
      <a href="appointments.html" class="nav-item"><i class="ph ph-calendar"></i> <span>Appointments</span></a>
      <a href="medications.html" class="nav-item"><i class="ph ph-pill"></i> <span>Medications</span></a>
      <a href="my-reports.html" class="nav-item active"><i class="ph ph-clipboard-text"></i> <span>Clinical History</span></a>
      <a href="profile.html" class="nav-item"><i class="ph ph-user"></i> <span>My Profile</span></a>
      <div style="margin-top:2rem; padding: 0 1rem;" id="authLinks"></div>
    </nav>
  </aside>

  <main class="app-main">
    <div class="top-bar">
      <div style="display:flex; align-items:center; gap:1rem;">
        <button class="icon-btn" id="toggleSidebar"><i class="ph ph-list"></i></button>
        <div class="welcome-msg">
          <h1>Clinical History</h1>
          <p>Access and manage your previously analyzed medical records.</p>
        </div>
      </div>
      <button class="icon-btn" id="toggleTheme"><i class="ph ph-moon"></i></button>
    </div>

    <div class="card">
       <div id="reportsList" style="display:flex; flex-direction:column; gap:1rem;">
          <p style="color:var(--text-muted);">Syncing your history...</p>
       </div>
    </div>
  </main>

  <script src="js/medi-assistant.js"></script>
  <script>
    window.onload = async () => {
      const token = localStorage.getItem("token");
      if (!token) window.location.href = "login.html";

      const body = document.getElementById("mainBody");
      const sidebar = document.getElementById("sidebar");
      const toggleSidebar = document.getElementById("toggleSidebar");
      const toggleTheme = document.getElementById("toggleTheme");

      if (localStorage.getItem("theme") === "dark") body.classList.add("dark-mode");
      if (localStorage.getItem("sidebar") === "collapsed") sidebar.classList.add("collapsed");

      toggleTheme.onclick = () => {
        body.classList.toggle("dark-mode");
        localStorage.setItem("theme", body.classList.contains("dark-mode") ? "dark" : "light");
      };

      toggleSidebar.onclick = () => {
        sidebar.classList.toggle("collapsed");
        localStorage.setItem("sidebar", sidebar.classList.contains("collapsed") ? "collapsed" : "expanded");
      };

      const authLinks = document.getElementById("authLinks");
      authLinks.innerHTML = `<a href="#" class="nav-item" id="logoutBtn" style="color:var(--danger)"><i class="ph ph-sign-out"></i> <span>Logout</span></a>`;
      document.getElementById("logoutBtn").onclick = () => { localStorage.clear(); window.location.href = "login.html"; };

      try {
        const res = await fetch("/my-reports", { headers: { "Authorization": token } });
        const data = await res.json();
        const list = document.getElementById("reportsList");
        list.innerHTML = "";
        
        if (data.success && data.reports.length > 0) {
          data.reports.forEach(r => {
            const div = document.createElement("div");
            div.className = "card";
            div.style.padding = "1rem";
            div.style.marginBottom = "0.75rem";
            div.style.display = "flex";
            div.style.justifyContent = "space-between";
            div.style.alignItems = "center";
            div.innerHTML = `
              <div style="display:flex; align-items:center; gap:1rem;">
                <i class="ph ph-file-text" style="font-size:1.5rem; color:var(--primary);"></i>
                <div>
                  <h4 style="margin-bottom:0.25rem;">Medical Analysis</h4>
                  <p style="font-size:0.8rem; color:var(--text-muted);">${new Date(r.createdAt).toLocaleDateString()}</p>
                </div>
              </div>
              <button class="btn-primary" style="padding:0.4rem 1rem; font-size:0.8rem;">View</button>
            `;
            div.querySelector("button").onclick = () => alert(r.content);
            list.appendChild(div);
          });
        } else {
          list.innerHTML = `<p style="color:var(--text-muted);">No reports found.</p>`;
        }
      } catch (err) { }
    };
  </script>
</body>
</html>
