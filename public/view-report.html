<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Report Details - MediBot</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --bg-sidebar: #0f172a;
      --bg-main: #020617;
      --primary: #06b6d4;
      --primary-hover: #0891b2;
      --secondary: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --danger: #f43f5e;
      --card-bg: rgba(17, 24, 39, 0.75);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .app-sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 0;
      height: 100%;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: var(--primary);
    }
    .brand-icon {
      background: var(--primary);
      color: var(--bg-main);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      margin: 0 1rem 1.5rem 1rem;
      background-color: rgba(255,255,255,0.03);
      border-radius: 0.75rem;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .user-profile img {
      width: 40px; height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-info h4 { font-size: 0.95rem; font-weight: 600; }
    .user-info span { font-size: 0.75rem; color: var(--text-muted); }

    .nav-menu {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0 1rem;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .nav-item i { font-size: 1.2rem; }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .nav-item.active {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
    }

    .nav-footer {
      padding: 1rem 1.5rem 0 1.5rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .app-main {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 3rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .page-header {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .page-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.25rem;
    }

    .box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 1.75rem;
      border-radius: 1rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(20px);
    }

    .box h2 {
      color: var(--primary);
      margin-bottom: 1rem;
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    ul { padding-left: 1.5rem; }
    li { margin-bottom: 0.5rem; line-height: 1.6; color: var(--text-muted); }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: rgba(6, 182, 212, 0.15);
      border-color: var(--primary);
      color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- LEFT SIDEBAR -->
  <aside class="app-sidebar">
    <div class="brand">
      <div class="brand-icon"><i class="ph ph-heartbeat"></i></div>
      MediBot
    </div>

    <div class="user-profile">
      <img src="https://ui-avatars.com/api/?name=User&background=06b6d4&color=fff" alt="User Profile" id="profileAvatar">
      <div class="user-info">
        <h4 id="sidebarUserName">Patient Profile</h4>
        <span>Clinical Record</span>
      </div>
    </div>

    <nav class="nav-menu">
      <a href="index.html" class="nav-item"><i class="ph ph-grid-four"></i> Dashboard</a>
      <a href="appointments.html" class="nav-item"><i class="ph ph-calendar"></i> Appointments</a>
      <a href="medications.html" class="nav-item"><i class="ph ph-pill"></i> Medications</a>
      <a href="my-reports.html" class="nav-item active"><i class="ph ph-clipboard-text"></i> History / Reports</a>
      <a href="profile.html" class="nav-item"><i class="ph ph-user"></i> My Profile</a>
      <a href="feedback.html" class="nav-item"><i class="ph ph-chat-centered-text"></i> Feedback</a>
      <a href="logout.html" class="nav-item" id="logoutBtn" style="color:var(--danger)"><i class="ph ph-sign-out"></i> Logout</a>
    </nav>
  </aside>

  <main class="app-main">
    <div class="page-header">
      <div>
        <h1>Report Details</h1>
        <p style="color:var(--text-muted); font-size:0.9rem;">In-depth analysis of your medical document</p>
      </div>
      <a href="my-reports.html" class="back-btn"><i class="ph ph-arrow-left"></i> Back to Reports</a>
    </div>

    <div id="report"></div>
  </main>

<script>
  window.onload = function() {
    const userNameDisplay = document.getElementById("sidebarUserName");
    const storedName = localStorage.getItem("name");
    if (userNameDisplay && storedName) {
      userNameDisplay.textContent = storedName;
      const profileImg = document.getElementById("profileAvatar");
      if (profileImg) profileImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(storedName)}&background=06b6d4&color=fff`;
    }
  };

  const rawData = localStorage.getItem("selectedReport");
  let data = null;
  try {
    data = rawData ? JSON.parse(rawData) : null;
  } catch (e) {
    data = null;
  }

  if (!data) {
    document.getElementById("report").innerHTML = 
      "<div class='box'><p style='color:var(--text-muted);'>No report data found. Please select a report from Clinical History.</p></div>";
  } else {
    let html = `
      <div class="box">
        <h2><i class="ph ph-file-text"></i> Summary</h2>
        <div style="line-height:1.7; color:var(--text-main);">${typeof data === 'string' ? data : (data.summary || data.content || JSON.stringify(data))}</div>
      </div>
    `;

    if (data.possibleIssues && Array.isArray(data.possibleIssues) && data.possibleIssues.length > 0) {
      html += `
        <div class="box">
          <h2><i class="ph ph-warning-circle"></i> Potential Biomarker Flags</h2>
          <ul>${data.possibleIssues.map(i => `<li>${i}</li>`).join("")}</ul>
        </div>
      `;
    }

    if (data.recommendations && Array.isArray(data.recommendations) && data.recommendations.length > 0) {
      html += `
        <div class="box">
          <h2><i class="ph ph-sparkle"></i> Clinical Next Steps & Regimen</h2>
          <ul>${data.recommendations.map(r => `<li>${r}</li>`).join("")}</ul>
        </div>
      `;
    }

    document.getElementById("report").innerHTML = html;
  }
</script>

</body>
</html>
