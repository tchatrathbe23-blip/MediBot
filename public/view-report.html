<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Report Details - MediBot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    /* --- CSS Reset & Variables --- */
    :root {
      --bg-sidebar: #0f172a;
      --bg-main: #020617;
      --primary: #a855f7;
      --primary-hover: #9333ea;
      --secondary: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --danger: #ef4444;
      --card-bg: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* --- SIDEBAR --- */
    .app-sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 0;
      height: 100%;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: white;
    }
    .brand-icon {
      background: white;
      color: var(--bg-main);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      margin: 0 1rem 1.5rem 1rem;
      background-color: rgba(255,255,255,0.03);
      border-radius: 0.75rem;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .user-profile img {
      width: 40px; height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-info h4 { font-size: 0.95rem; font-weight: 600; }
    .user-info span { font-size: 0.75rem; color: var(--text-muted); }

    .nav-menu {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0 1rem;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .nav-item i { font-size: 1.2rem; }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .nav-item.active {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }

    .nav-footer {
      padding: 1rem 1.5rem 0 1.5rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* --- MAIN CONTENT --- */
    .app-main {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 3rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .page-header {
      margin-bottom: 2rem;
    }
    .page-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 2rem;
      border-radius: 1rem;
      margin-bottom: 1.5rem;
    }

    .box h2 {
      color: var(--primary);
      margin-bottom: 1rem;
      font-size: 1.2rem;
      font-weight: 600;
    }

    ul { padding-left: 1.5rem; }
    li { margin-bottom: 0.5rem; line-height: 1.6; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- LEFT SIDEBAR -->
  <aside class="app-sidebar">
    <div class="brand">
      <div class="brand-icon"><i class="ph ph-robot"></i></div>
      MediBot
    </div>

    <div class="user-profile">
      <img src="https://ui-avatars.com/api/?name=User&background=a855f7&color=fff" alt="User Profile">
      <div class="user-info">
        <h4>Demo User</h4>
        <span>Report Detail</span>
      </div>
    </div>

    <nav class="nav-menu">
      <a href="index.html" class="nav-item"><i class="ph ph-file-text"></i> Summary Tool</a>
      <a href="appointments.html" class="nav-item"><i class="ph ph-calendar"></i> Appointments</a>
      <a href="medications.html" class="nav-item"><i class="ph ph-pill"></i> Medications</a>
      <a href="my-reports.html" class="nav-item"><i class="ph ph-clock-counter-clockwise"></i> History / Reports</a>
      <a href="profile.html" class="nav-item"><i class="ph ph-user"></i> My Profile</a>
      <a href="feedback.html" class="nav-item"><i class="ph ph-chat-centered-text"></i> Feedback</a>
      <a href="#" class="nav-item" id="logoutBtn" style="color:var(--danger)"><i class="ph ph-sign-out"></i> Logout</a>
    </nav>

    <div class="nav-footer">
      <a href="#" class="nav-item"><i class="ph ph-sun"></i> Light Mode</a>
      <a href="#" class="nav-item" style="color: var(--danger);" id="logoutSidebar"><i class="ph ph-sign-out"></i> Sign Out</a>
    </div>
  </aside>

  <main class="app-main">
    <div class="page-header">
      <h1>Report Details</h1>
      <p>In-depth analysis of your medical document</p>
    </div>

    <div id="report"></div>
  </main>

<script>
  // Backend URL (for future API calls)
  const API_BASE = "";

  window.onload = function() {
      // Logout logic
      const logoutSidebar = document.getElementById("logoutSidebar");
      if (logoutSidebar) {
        logoutSidebar.addEventListener("click", (e) => {
          e.preventDefault();
          localStorage.removeItem("token");
          localStorage.removeItem("name");
          window.location.href = "landing.html";
        });
      }

      // User profile update
      const userNameDisplay = document.querySelector(".user-info h4");
      const storedName = localStorage.getItem("name");
      if (userNameDisplay && storedName) {
        userNameDisplay.textContent = storedName;
        const profileImg = document.querySelector(".user-profile img");
        if (profileImg) profileImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(storedName)}&background=a855f7&color=fff`;
      }
  };

  // Load selected report from localStorage
  const data = JSON.parse(localStorage.getItem("selectedReport"));

  if (!data) {
    document.getElementById("report").innerHTML = 
      "<div class='box'>No report data found.</div>";
  } else {
    let html = `
      <div class="box">
        <h2>Summary</h2>${data.summary}
      </div>

      <div class="box">
        <h2>Possible Issues</h2>
        <ul>${data.possibleIssues.map(i => `<li>${i}</li>`).join("")}</ul>
      </div>

      <div class="box">
        <h2>Recommendations</h2>
        <ul>${data.recommendations.map(r => `<li>${r}</li>`).join("")}</ul>
      </div>
    `;

    document.getElementById("report").innerHTML = html;
  }
</script>

</body>
</html>
