<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - MediBot Clinical Vault</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080c14;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    .auth-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 3rem 2.5rem;
      text-align: center;
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(6, 182, 212, 0.3);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7), 0 0 35px rgba(6, 182, 212, 0.2);
    }
  </style>
</head>
<body>

  <!-- Three.js Ambient 3D Canvas -->
  <canvas id="bg-canvas"></canvas>

  <div class="card auth-card animate-fade-in">
    <div class="brand" style="justify-content:center; padding:0; margin-bottom:1.25rem;">
      <i class="ph ph-heartbeat"></i> <span>MediBot</span>
    </div>
    <span class="hologram-tag" style="margin-bottom:1rem; font-size:0.75rem;">Encrypted Clinical Portal</span>
    <h2 style="font-size:1.6rem; font-weight:800; margin-bottom:0.4rem; color:#ffffff;">Welcome Back</h2>
    <p style="color:var(--text-muted); margin-bottom:2rem; font-size:0.9rem;">Sign in to access your AI health diagnostic vault.</p>

    <form id="loginForm">
      <div class="form-group">
        <label>Patient / Physician Name</label>
        <input type="text" id="name" placeholder="e.g. John Doe" required>
      </div>
      <div class="form-group">
        <label>Passphrase</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div style="display:flex; justify-content:flex-end; margin-bottom:1rem;">
        <a href="forgot.html" style="font-size:0.8rem; color:var(--primary); text-decoration:none;">Forgot Passphrase?</a>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">
        <i class="ph ph-lock-key"></i> Authenticate & Enter
      </button>
    </form>

    <p style="margin-top:2rem; font-size:0.9rem; color:var(--text-muted);">
      New to MediBot? <a href="signup.html" style="color:var(--primary); font-weight:600; text-decoration:none;">Create Free Account</a>
    </p>
  </div>

  <script>
    // 3D Background
    (function() {
      const canvas = document.getElementById("bg-canvas");
      if (!canvas || !window.THREE) return;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 25;
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const pGeo = new THREE.BufferGeometry();
      const count = 300;
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i++) pos[i] = (Math.random() - 0.5) * 50;
      pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const pMat = new THREE.PointsMaterial({ color: 0x06b6d4, size: 0.3, transparent: true, opacity: 0.6 });
      const pMesh = new THREE.Points(pGeo, pMat);
      scene.add(pMesh);

      function anim() {
        requestAnimationFrame(anim);
        pMesh.rotation.y += 0.001;
        pMesh.rotation.x += 0.0005;
        renderer.render(scene, camera);
      }
      anim();
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();

    document.getElementById("loginForm").onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("name", data.name);
          window.location.href = "index.html";
        } else {
          alert(data.message || "Invalid credentials.");
        }
      } catch (err) {
        alert("Login failed. Check server connection.");
      }
    };
  </script>
</body>
</html>
