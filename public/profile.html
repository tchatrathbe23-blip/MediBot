<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - MediBot Security</title>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function() {
      const theme = localStorage.getItem("theme");
      if (theme === "dark" || !theme) document.documentElement.classList.add("dark-mode");
    })();
  </script>
</head>
<body id="mainBody">

  <!-- Ambient 3D background canvas -->
  <canvas id="bg-canvas" style="position:fixed; top:0; left:0; z-index:-1;"></canvas>

  <aside class="app-sidebar" id="sidebar">
    <div class="brand">
      <i class="ph ph-heartbeat"></i> <span>MediBot</span>
    </div>
    <nav class="nav-menu">
      <a href="index.html" class="nav-item"><i class="ph ph-grid-four"></i> <span>Dashboard</span></a>
      <a href="appointments.html" class="nav-item"><i class="ph ph-calendar"></i> <span>Appointments</span></a>
      <a href="medications.html" class="nav-item"><i class="ph ph-pill"></i> <span>Medications</span></a>
      <a href="my-reports.html" class="nav-item"><i class="ph ph-clipboard-text"></i> <span>Clinical History</span></a>
      <a href="profile.html" class="nav-item active"><i class="ph ph-user"></i> <span>My Profile</span></a>
      <div style="margin-top:2rem; padding: 0 0.5rem;" id="authLinks"></div>
    </nav>
  </aside>

  <main class="app-main">
    <div class="top-bar">
      <div style="display:flex; align-items:center; gap:1rem;">
        <button class="icon-btn" id="toggleSidebar"><i class="ph ph-list"></i></button>
        <div class="welcome-msg">
          <h1>Patient Profile & Security</h1>
          <p>Manage personal medical identity and encrypted credentials.</p>
        </div>
      </div>
      <button class="icon-btn" id="toggleTheme"><i class="ph ph-sun"></i></button>
    </div>

    <div class="card" style="max-width: 650px;">
       <div style="display:flex; align-items:center; gap:1.75rem; margin-bottom:2rem; padding-bottom:1.5rem; border-bottom:1px solid var(--glass-border);">
          <img id="profileAvatar" src="https://ui-avatars.com/api/?background=06b6d4&color=fff&size=128"
            style="width:90px; height:90px; border-radius:1.25rem; border:2px solid var(--primary); box-shadow:0 0 20px var(--primary-glow);">
          <div>
             <span class="hologram-tag" style="margin-bottom:0.35rem; display:inline-block; font-size:0.75rem; color:var(--primary);">Verified Clinical Account</span>
             <h2 id="profileName" style="font-size:1.4rem; font-weight:700; margin-bottom:0.2rem;">Loading Patient...</h2>
             <p style="color:var(--text-muted); font-size:0.85rem;">256-Bit Encrypted Medical Profile</p>
          </div>
       </div>

       <form id="profileForm">
         <div style="display:grid; gap:1.25rem;">
            <div class="form-group" style="margin-bottom:0;">
               <label>Full Display Name</label>
               <input type="text" id="pName" placeholder="Enter full name" required style="width:100%; padding:0.75rem; border-radius:0.75rem; border:1px solid var(--border-color); background:var(--bg-main); color:var(--text-main);">
            </div>
            <button type="submit" class="btn-primary" id="updateBtn" style="width:100%;">
              <i class="ph ph-floppy-disk"></i> Update Profile Information
            </button>
         </div>
       </form>
       
       <div id="feedbackMsg" style="margin-top:1.25rem; text-align:center; display:none; font-size:0.9rem; color:var(--success); font-weight:600; background:rgba(16,185,129,0.1); padding:0.75rem; border-radius:0.75rem; border:1px solid rgba(16,185,129,0.3);">
          <i class="ph ph-check-circle"></i> Profile information updated successfully!
       </div>
    </div>
  </main>

  <script src="js/medi-assistant.js"></script>
  <script>
    // 3D Background
    (function() {
      const canvas = document.getElementById("bg-canvas");
      if (!canvas || !window.THREE) return;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 30;
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const pGeo = new THREE.BufferGeometry();
      const pos = new Float32Array(150 * 3);
      for (let i = 0; i < 150 * 3; i++) pos[i] = (Math.random() - 0.5) * 60;
      pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const pMat = new THREE.PointsMaterial({ color: 0x06b6d4, size: 0.25, transparent: true, opacity: 0.4 });
      const pMesh = new THREE.Points(pGeo, pMat);
      scene.add(pMesh);

      function anim() {
        requestAnimationFrame(anim);
        pMesh.rotation.y += 0.0006;
        renderer.render(scene, camera);
      }
      anim();
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();

    window.onload = () => {
      const token = localStorage.getItem("token");
      let name = localStorage.getItem("name") || "Guest Patient";
      if (!token) window.location.href = "login.html";

      const sidebar = document.getElementById("sidebar");
      const toggleSidebar = document.getElementById("toggleSidebar");
      const toggleTheme = document.getElementById("toggleTheme");

      if (localStorage.getItem("theme") === "dark" || !localStorage.getItem("theme")) {
        document.documentElement.classList.add("dark-mode");
        toggleTheme.innerHTML = '<i class="ph ph-sun"></i>';
      } else {
        document.documentElement.classList.remove("dark-mode");
        toggleTheme.innerHTML = '<i class="ph ph-moon"></i>';
      }

      if (localStorage.getItem("sidebar") === "collapsed") sidebar.classList.add("collapsed");

      toggleTheme.onclick = () => {
        const isDark = document.documentElement.classList.toggle("dark-mode");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        toggleTheme.innerHTML = isDark ? '<i class="ph ph-sun"></i>' : '<i class="ph ph-moon"></i>';
      };

      toggleSidebar.onclick = () => {
        sidebar.classList.toggle("collapsed");
        localStorage.setItem("sidebar", sidebar.classList.contains("collapsed") ? "collapsed" : "expanded");
      };

      const updateUI = (newName) => {
        document.getElementById("profileName").innerText = newName;
        document.getElementById("pName").value = newName;
        document.getElementById("profileAvatar").src = `https://ui-avatars.com/api/?name=${encodeURIComponent(newName)}&background=06b6d4&color=fff&size=128`;
      };

      updateUI(name);

      const authLinks = document.getElementById("authLinks");
      authLinks.innerHTML = `<a href="#" class="nav-item" id="logoutBtn" style="color:var(--danger)"><i class="ph ph-sign-out"></i> <span>Logout</span></a>`;
      document.getElementById("logoutBtn").onclick = () => { localStorage.clear(); window.location.href = "login.html"; };

      document.getElementById("profileForm").onsubmit = async (e) => {
        e.preventDefault();
        const updatedName = document.getElementById("pName").value.trim();
        if (!updatedName) return;

        try {
          const res = await fetch("/update-profile", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": token },
            body: JSON.stringify({ name: updatedName })
          });
          const data = await res.json();
          if (data.success) {
            localStorage.setItem("name", updatedName);
            updateUI(updatedName);
            const msg = document.getElementById("feedbackMsg");
            msg.style.display = "block";
            setTimeout(() => msg.style.display = "none", 3000);
          } else {
            alert(data.message || "Failed to update profile.");
          }
        } catch (err) {
          alert("Error connecting to server.");
        }
      };
    };
  </script>
</body>
</html>
