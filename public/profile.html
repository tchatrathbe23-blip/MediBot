<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile - MediBot</title>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    (function() {
      const theme = localStorage.getItem("theme");
      if (theme === "dark") document.documentElement.classList.add("dark-mode");
    })();
  </script>
</head>
<body id="mainBody">

  <aside class="app-sidebar" id="sidebar">
    <div class="brand">
      <i class="ph ph-heartbeat"></i> <span>MediBot</span>
    </div>
    <nav class="nav-menu">
      <a href="index.html" class="nav-item"><i class="ph ph-grid-four"></i> <span>Dashboard</span></a>
      <a href="appointments.html" class="nav-item"><i class="ph ph-calendar"></i> <span>Appointments</span></a>
      <a href="medications.html" class="nav-item"><i class="ph ph-pill"></i> <span>Medications</span></a>
      <a href="my-reports.html" class="nav-item"><i class="ph ph-clipboard-text"></i> <span>Clinical History</span></a>
      <a href="profile.html" class="nav-item active"><i class="ph ph-user"></i> <span>My Profile</span></a>
      <div style="margin-top:2rem; padding: 0 1rem;" id="authLinks"></div>
    </nav>
  </aside>

  <main class="app-main">
    <div class="top-bar">
      <div style="display:flex; align-items:center; gap:1rem;">
        <button class="icon-btn" id="toggleSidebar"><i class="ph ph-list"></i></button>
        <div class="welcome-msg">
          <h1>My Profile</h1>
          <p>Security and personal health information.</p>
        </div>
      </div>
      <button class="icon-btn" id="toggleTheme"><i class="ph ph-moon"></i></button>
    </div>

    <div class="card" style="max-width: 600px;">
       <div style="display:flex; align-items:center; gap:2rem; margin-bottom:2rem; padding-bottom:2rem; border-bottom:1px solid var(--border-color);">
          <img id="profileAvatar" src="https://ui-avatars.com/api/?background=3b82f6&color=fff&size=128" style="width:100px; border-radius:1.5rem;">
          <div>
             <h2 id="profileName">Loading...</h2>
             <p style="color:var(--text-muted);">Health Account Verified</p>
          </div>
       </div>

       <form id="profileForm">
         <div style="display:grid; gap:1.5rem;">
            <div style="display:flex; flex-direction:column; gap:0.5rem;">
               <label style="font-weight:600; font-size:0.9rem; color:var(--text-muted);">Display Name</label>
               <input type="text" id="pName" placeholder="Enter your name" style="padding:0.75rem; border-radius:0.75rem; border:1px solid var(--border-color); background:var(--bg-main); color:var(--text-main); outline:none;">
            </div>
            <button type="submit" class="btn-primary" id="updateBtn">Update Profile Info</button>
         </div>
       </form>
       
       <div id="feedbackMsg" style="margin-top:1rem; text-align:center; display:none; font-size:0.9rem; color:var(--success); font-weight:600;">
          <i class="ph ph-check-circle"></i> Profile updated successfully!
       </div>
    </div>
  </main>

  <script src="js/medi-assistant.js"></script>
  <script>
    window.onload = () => {
      const token = localStorage.getItem("token");
      let name = localStorage.getItem("name") || "Guest User";
      if (!token) window.location.href = "login.html";

      const sidebar = document.getElementById("sidebar");
      const toggleSidebar = document.getElementById("toggleSidebar");
      const toggleTheme = document.getElementById("toggleTheme");

      if (document.documentElement.classList.contains("dark-mode")) {
        toggleTheme.innerHTML = '<i class="ph ph-sun"></i>';
      }

      if (localStorage.getItem("sidebar") === "collapsed") sidebar.classList.add("collapsed");

      toggleTheme.onclick = () => {
        const isDark = document.documentElement.classList.toggle("dark-mode");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        toggleTheme.innerHTML = isDark ? '<i class="ph ph-sun"></i>' : '<i class="ph ph-moon"></i>';
      };

      toggleSidebar.onclick = () => {
        sidebar.classList.toggle("collapsed");
        localStorage.setItem("sidebar", sidebar.classList.contains("collapsed") ? "collapsed" : "expanded");
      };

      const updateUI = (newName) => {
        document.getElementById("profileName").innerText = newName;
        document.getElementById("pName").value = newName;
        document.getElementById("profileAvatar").src = `https://ui-avatars.com/api/?name=${encodeURIComponent(newName)}&background=3b82f6&color=fff&size=128`;
      };

      updateUI(name);

      const authLinks = document.getElementById("authLinks");
      authLinks.innerHTML = `<a href="#" class="nav-item" id="logoutBtn" style="color:var(--danger)"><i class="ph ph-sign-out"></i> <span>Logout</span></a>`;
      document.getElementById("logoutBtn").onclick = () => { localStorage.clear(); window.location.href = "login.html"; };

      // Update Logic
      const form = document.getElementById("profileForm");
      const feedback = document.getElementById("feedbackMsg");

      form.onsubmit = async (e) => {
        e.preventDefault();
        const newName = document.getElementById("pName").value;
        
        try {
          const res = await fetch("/update-profile", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": token },
            body: JSON.stringify({ name: newName })
          });
          const data = await res.json();
          if(data.success) {
            localStorage.setItem("name", newName);
            updateUI(newName);
            feedback.style.display = "block";
            setTimeout(() => { feedback.style.display = "none"; }, 3000);
          }
        } catch (err) { }
      };
    };
  </script>
</body>
</html>
