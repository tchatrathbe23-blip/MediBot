<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medications - MediBot Rx Tracker</title>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function() {
      const theme = localStorage.getItem("theme");
      if (theme === "dark" || !theme) document.documentElement.classList.add("dark-mode");
    })();
  </script>
</head>
<body id="mainBody">

  <!-- Ambient 3D background canvas -->
  <canvas id="bg-canvas"></canvas>

  <aside class="app-sidebar" id="sidebar">
    <div class="brand">
      <i class="ph ph-heartbeat"></i> <span>MediBot</span>
    </div>
    <nav class="nav-menu">
      <a href="index.html" class="nav-item"><i class="ph ph-grid-four"></i> <span>Dashboard</span></a>
      <a href="appointments.html" class="nav-item"><i class="ph ph-calendar"></i> <span>Appointments</span></a>
      <a href="medications.html" class="nav-item active"><i class="ph ph-pill"></i> <span>Medications</span></a>
      <a href="my-reports.html" class="nav-item"><i class="ph ph-clipboard-text"></i> <span>Clinical History</span></a>
      <a href="profile.html" class="nav-item"><i class="ph ph-user"></i> <span>My Profile</span></a>
      <div style="margin-top:2rem; padding: 0 0.5rem;" id="authLinks"></div>
    </nav>
  </aside>

  <main class="app-main">
    <div class="top-bar">
      <div style="display:flex; align-items:center; gap:1rem;">
        <button class="icon-btn" id="toggleSidebar"><i class="ph ph-list"></i></button>
        <div class="welcome-msg">
          <h1>Active Prescriptions & Regimens</h1>
          <p>Track dosages, administration intervals, and clinical notes.</p>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:1rem;">
        <button class="icon-btn" id="toggleTheme"><i class="ph ph-sun"></i></button>
        <button class="btn-primary" id="openModalBtn">
          <i class="ph ph-plus-circle"></i> Add Prescription
        </button>
      </div>
    </div>

    <div class="card">
       <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
          <h2 style="font-size:1.25rem; font-weight:700; color:var(--primary); display:flex; align-items:center; gap:0.5rem;">
            <i class="ph ph-pill"></i> Prescriptions & Supplements
          </h2>
       </div>

       <div id="medsList" style="display:flex; flex-direction:column; gap:0.85rem;">
          <p style="color:var(--text-muted); text-align:center; padding:3rem;">
            <i class="ph ph-circle-notch ph-spin" style="font-size:1.75rem; color:var(--primary); display:block; margin-bottom:0.5rem;"></i>
            Loading your active prescriptions...
          </p>
       </div>
    </div>
  </main>

  <!-- Medication Modal -->
  <div id="medModal" class="modal">
    <div class="modal-content" style="max-width:550px;">
      <div class="modal-header">
        <div>
          <span class="hologram-tag" style="margin-bottom:0.35rem;">Rx Tracker</span>
          <h2 style="font-size:1.35rem; color:var(--primary);">New Prescription Entry</h2>
        </div>
        <button class="icon-btn" id="closeModalBtn"><i class="ph ph-x"></i></button>
      </div>
      <form id="medForm">
        <div class="form-group">
          <label>Medication / Supplement Name</label>
          <input type="text" id="medName" placeholder="e.g. Metformin / Atorvastatin" required>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label>Dosage</label>
            <input type="text" id="medDosage" placeholder="e.g. 500mg" required>
          </div>
          <div class="form-group">
            <label>Schedule / Frequency</label>
            <input type="text" id="medSchedule" placeholder="e.g. Twice Daily with Meals" required>
          </div>
        </div>
        <div class="form-group">
          <label>Clinical Notes / Prescribing Doctor</label>
          <textarea id="medNotes" placeholder="e.g. Take with a full glass of water. Refill required next month." rows="3"></textarea>
        </div>
        <button type="submit" class="btn-primary" style="width:100%; margin-top:1rem;">
          <i class="ph ph-check-circle"></i> Save Medication Regimen
        </button>
      </form>
    </div>
  </div>

  <script src="js/medi-assistant.js"></script>
  <script>
    const token = localStorage.getItem("token");

    // 3D Ambient Canvas
    (function() {
      const canvas = document.getElementById("bg-canvas");
      if (!canvas || !window.THREE) return;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 30;
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const pGeo = new THREE.BufferGeometry();
      const pos = new Float32Array(150 * 3);
      for (let i = 0; i < 150 * 3; i++) pos[i] = (Math.random() - 0.5) * 60;
      pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const pMat = new THREE.PointsMaterial({ color: 0x818cf8, size: 0.25, transparent: true, opacity: 0.4 });
      const pMesh = new THREE.Points(pGeo, pMat);
      scene.add(pMesh);

      function anim() {
        requestAnimationFrame(anim);
        pMesh.rotation.y += 0.0006;
        renderer.render(scene, camera);
      }
      anim();
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();

    async function loadMedications() {
      const list = document.getElementById("medsList");
      try {
        const res = await fetch("/medications", { headers: { "Authorization": token } });
        const data = await res.json();
        list.innerHTML = "";
        
        if (data.success && data.medications.length > 0) {
          data.medications.forEach(med => {
            const div = document.createElement("div");
            div.className = "card";
            div.style.padding = "1.25rem";
            div.style.marginBottom = "0";
            div.style.display = "flex";
            div.style.justifyContent = "space-between";
            div.style.alignItems = "center";
            div.style.background = "rgba(17, 24, 39, 0.5)";

            div.innerHTML = `
              <div style="display:flex; align-items:center; gap:1.25rem;">
                <div style="background:rgba(16,185,129,0.12); color:var(--success); width:50px; height:50px; border-radius:0.85rem; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                   <i class="ph ph-pill" style="font-size:1.5rem;"></i>
                </div>
                <div>
                  <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.25rem;">
                    <h4 style="font-weight:700; font-size:1.05rem;">${med.name}</h4>
                    <span style="font-size:0.75rem; background:rgba(6,182,212,0.15); color:var(--primary); padding:0.15rem 0.5rem; border-radius:1rem;">${med.dosage}</span>
                  </div>
                  <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:0.25rem;">
                    <i class="ph ph-clock"></i> Frequency: ${med.schedule}
                  </p>
                  <p style="font-size:0.8rem; color:#64748b;">${med.notes || 'No special intake notes.'}</p>
                </div>
              </div>
              <button class="icon-btn" style="color:var(--danger); border-color:rgba(244,63,94,0.3);" title="Remove Medication">
                <i class="ph ph-trash"></i>
              </button>
            `;

            div.querySelector("button").onclick = () => deleteMedication(med._id);
            list.appendChild(div);
          });
        } else {
          list.innerHTML = `
            <div style="text-align:center; padding:3rem 1rem;">
              <i class="ph ph-pill" style="font-size:3rem; color:var(--text-muted); margin-bottom:1rem;"></i>
              <h3 style="margin-bottom:0.5rem;">No Active Medications Tracked</h3>
              <p style="color:var(--text-muted); font-size:0.9rem;">Add current prescriptions to track dosages and receive advice.</p>
            </div>
          `;
        }
      } catch (err) {
        list.innerHTML = `<p style="color:var(--danger); text-align:center;">Failed to load medications.</p>`;
      }
    }

    async function deleteMedication(id) {
      if (!confirm("Are you sure you want to remove this medication?")) return;
      try {
        const res = await fetch(`/medications/${id}`, {
          method: "DELETE",
          headers: { "Authorization": token }
        });
        const data = await res.json();
        if (data.success) loadMedications();
      } catch (e) {
        alert("Error deleting medication.");
      }
    }

    window.onload = () => {
      if (!token) window.location.href = "login.html";

      const sidebar = document.getElementById("sidebar");
      const toggleSidebar = document.getElementById("toggleSidebar");
      const toggleTheme = document.getElementById("toggleTheme");

      if (localStorage.getItem("theme") === "dark" || !localStorage.getItem("theme")) {
        document.documentElement.classList.add("dark-mode");
        toggleTheme.innerHTML = '<i class="ph ph-sun"></i>';
      } else {
        document.documentElement.classList.remove("dark-mode");
        toggleTheme.innerHTML = '<i class="ph ph-moon"></i>';
      }

      if (localStorage.getItem("sidebar") === "collapsed") sidebar.classList.add("collapsed");

      toggleTheme.onclick = () => {
        const isDark = document.documentElement.classList.toggle("dark-mode");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        toggleTheme.innerHTML = isDark ? '<i class="ph ph-sun"></i>' : '<i class="ph ph-moon"></i>';
      };

      toggleSidebar.onclick = () => {
        sidebar.classList.toggle("collapsed");
        localStorage.setItem("sidebar", sidebar.classList.contains("collapsed") ? "collapsed" : "expanded");
      };

      const authLinks = document.getElementById("authLinks");
      authLinks.innerHTML = `<a href="#" class="nav-item" id="logoutBtn" style="color:var(--danger)"><i class="ph ph-sign-out"></i> <span>Logout</span></a>`;
      document.getElementById("logoutBtn").onclick = () => { localStorage.clear(); window.location.href = "login.html"; };

      // Modal Controls
      const modal = document.getElementById("medModal");
      const openBtn = document.getElementById("openModalBtn");
      const closeBtn = document.getElementById("closeModalBtn");

      openBtn.onclick = () => {
        modal.style.display = "flex";
      };

      const closeModal = () => {
        modal.style.display = "none";
      };

      closeBtn.onclick = closeModal;
      window.onclick = (e) => { if (e.target === modal) closeModal(); };

      // Form Submit
      document.getElementById("medForm").onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById("medName").value;
        const dosage = document.getElementById("medDosage").value;
        const schedule = document.getElementById("medSchedule").value;
        const notes = document.getElementById("medNotes").value;

        try {
          const res = await fetch("/medications", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": token },
            body: JSON.stringify({ name, dosage, schedule, notes })
          });
          const data = await res.json();
          if (data.success) {
            closeModal();
            document.getElementById("medForm").reset();
            loadMedications();
          } else {
            alert(data.message || "Failed to save medication.");
          }
        } catch (err) {
          alert("Error connecting to server.");
        }
      };

      loadMedications();
    };
  </script>
</body>
</html>
