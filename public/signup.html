<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - MediBot</title>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body { display: flex; align-items: center; justify-content: center; background: #f8fafc; height: 100vh; }
    .auth-card { width: 100%; max-width: 400px; padding: 2.5rem; text-align: center; }
    .form-group { text-align: left; margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted); }
    .form-group input { width: 100%; padding: 0.8rem; border-radius: 0.75rem; border: 1px solid var(--border-color); outline: none; }
    .form-group input:focus { border-color: var(--primary); }
  </style>
</head>
<body>

  <div class="card auth-card">
    <div class="brand" style="justify-content:center; padding:0; margin-bottom:1.5rem;">
      <i class="ph ph-heartbeat"></i> MediBot
    </div>
    <h2 style="margin-bottom:0.5rem;">Join MediBot</h2>
    <p style="color:var(--text-muted); margin-bottom:2rem; font-size:0.9rem;">Start managing your health with AI-powered insights.</p>

    <form id="signupForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label>Set Passphrase</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary" style="width:100%; margin-top:1rem;">Register Now</button>
    </form>

    <p style="margin-top:1.5rem; font-size:0.9rem; color:var(--text-muted);">
      Already have an account? <a href="login.html" style="color:var(--primary); font-weight:600; text-decoration:none;">Sign In</a>
    </p>
  </div>

  <script>
    document.getElementById("signupForm").onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, password })
        });
        const data = await res.json();
        if (data.success) {
          alert("Account created! Please login.");
          window.location.href = "login.html";
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert("Registration failed.");
      }
    };
  </script>
</body>
</html>
