<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Appointments - MediBot</title>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <aside class="app-sidebar">
    <div class="brand">
      <i class="ph ph-heartbeat"></i> MediBot
    </div>
    <nav class="nav-menu">
      <a href="index.html" class="nav-item"><i class="ph ph-grid-four"></i> Dashboard</a>
      <a href="appointments.html" class="nav-item active"><i class="ph ph-calendar"></i> Appointments</a>
      <a href="medications.html" class="nav-item"><i class="ph ph-pill"></i> Medications</a>
      <a href="my-reports.html" class="nav-item"><i class="ph ph-clipboard-text"></i> Clinical History</a>
      <a href="profile.html" class="nav-item"><i class="ph ph-user"></i> My Profile</a>
      <a href="feedback.html" class="nav-item"><i class="ph ph-chat-centered-text"></i> Feedback</a>
      <div style="margin-top:2rem; padding: 0 1rem;" id="authLinks"></div>
    </nav>
  </aside>

  <main class="app-main">
    <div class="top-bar">
      <div class="welcome-msg">
        <h1>My Appointments</h1>
        <p>Manage your upcoming consultations and checkups.</p>
      </div>
      <button class="btn-primary">+ Add New</button>
    </div>

    <div class="card">
       <div id="appointmentsList" style="display:flex; flex-direction:column; gap:1rem;">
          <!-- Placeholder for list -->
          <div style="padding:1rem; border:1px solid var(--border-color); border-radius:1rem; display:flex; justify-content:space-between; align-items:center;">
             <div>
                <h4 style="margin-bottom:0.25rem;">General Physician</h4>
                <p style="font-size:0.8rem; color:var(--text-muted);">Dr. Sarah Stone • April 24, 2025</p>
             </div>
             <span style="background:#eff6ff; color:var(--primary); padding:0.25rem 0.75rem; border-radius:2rem; font-size:0.75rem; font-weight:600;">Upcoming</span>
          </div>
       </div>
    </div>
  </main>

  <script src="js/medi-assistant.js"></script>
  <script>
     window.onload = () => {
        const token = localStorage.getItem("token");
        if (!token) window.location.href = 'login.html';
        const authLinks = document.getElementById("authLinks");
        authLinks.innerHTML = `<a href="#" class="nav-item" id="logoutBtn" style="color:var(--danger)"><i class="ph ph-sign-out"></i> Logout</a>`;
        document.getElementById("logoutBtn").onclick = () => {
           localStorage.clear();
           window.location.href = "login.html";
        };
     }
  </script>
</body>
</html>
